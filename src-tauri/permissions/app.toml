# Hanzo IDE Application Command Permissions
#
# In release builds (`tauri-plugin-localhost`), the frontend is served over
# `http://localhost:<port>`. Tauri 2.12+ enforces ACL on non-local origins
# (`!is_local`), requiring an explicit application permission set so custom
# `#[tauri::command]` handlers are authorized for the main and detached-chat windows.

[[permission]]
identifier = "allow-hanzo-ide-commands"
description = "Authorizes Hanzo IDE windows to invoke registered IDE, filesystem, terminal, git, search, LSP/DAP, indexer, auth, chat, memory, and MCP commands."
commands.allow = [
  "terminal_spawn",
  "terminal_write",
  "terminal_resize",
  "terminal_kill",
  "fs_watch",
  "fs_unwatch",
  "git_status",
  "git_diff",
  "git_stage",
  "git_stage_all",
  "git_unstage",
  "git_commit",
  "git_log",
  "git_branches",
  "git_checkout",
  "git_checkpoint_create",
  "git_checkpoint_restore",
  "search_files",
  "search_file_list",
  "lsp_start",
  "lsp_send",
  "lsp_stop",
  "lsp_list",
  "dap_start",
  "dap_send",
  "dap_stop",
  "remote_connect",
  "remote_exec",
  "remote_read_file",
  "remote_write_file",
  "remote_list_dir",
  "ext_host_start",
  "ext_host_send",
  "ext_host_stop",
  "ext_host_status",
  "ext_host_log",
  "ext_fetch_url_text",
  "ext_download_url_to_path",
  "ext_extract_vsix",
  "ext_get_disabled",
  "ext_set_disabled",
  "ide_tool_response",
  "ide_edit_review_response",
  "open_new_window",
