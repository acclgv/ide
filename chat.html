<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hanzo Chat</title>
    <script>
      (function () {
        var ua = (navigator.platform || '') + ' ' + (navigator.userAgent || '');
        document.documentElement.dataset.hanzoPlatform = /Mac|Darwin/i.test(ua)
          ? 'macos'
          : /Win/i.test(ua)
            ? 'windows'
            : 'linux';
      })();
    </script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        width: 100%;
        overflow: hidden;
        background: var(--hanzo-floor, #090909);
        color: var(--hanzo-text, #fafafa);
      }

      html[data-hanzo-platform='linux']:not([data-maximized='true']),
      html[data-hanzo-platform='linux']:not([data-maximized='true']) body {
        background: transparent !important;
        background-color: transparent !important;
      }

      #hanzo-chat-detached-root {
        background: var(--hanzo-floor, #090909);
        height: 100%;
        width: 100%;
        position: relative;
      }

      html[data-hanzo-platform='linux']:not([data-maximized='true']) #hanzo-chat-detached-root {
        border-radius: 12px;
        overflow: hidden;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.10);
      }

      /*
       * Shim for the VS Code design tokens the chat panel uses when running in
       * the standalone detached chat window without the workbench CSS host.
       * Mirrors the canonical Hanzo Unified Shell tokens.
       */
      :root {
        --vscode-foreground: var(--hanzo-text, #fafafa);
        --vscode-descriptionForeground: var(--hanzo-text-secondary, #a1a1aa);
        --vscode-editor-background: var(--hanzo-bg, #111114);
        --vscode-sideBar-background: var(--hanzo-sidebar, #0c0c0c);
        --vscode-input-background: var(--hanzo-surface-card, #141417);
        --vscode-input-foreground: var(--hanzo-text, #fafafa);
        --vscode-input-border: var(--hanzo-border, #222226);
        --vscode-button-background: var(--hanzo-accent, #ffffff);
        --vscode-button-foreground: var(--hanzo-accent-ink, #09090b);
        --vscode-widget-border: var(--hanzo-border, #222226);
        --vscode-textLink-foreground: var(--hanzo-text, #fafafa);
        --vscode-focusBorder: var(--hanzo-border-focus, rgba(250, 250, 250, 0.32));
        --vscode-scrollbarSlider-background: rgba(255, 255, 255, 0.12);
        --vscode-scrollbarSlider-hoverBackground: rgba(255, 255, 255, 0.22);
      }
    </style>
  </head>
  <body>
    <div id="hanzo-chat-detached-root" class="hanzo-chat-container"></div>
    <script type="module" src="/src/chat-main.ts"></script>
  </body>
</html>
